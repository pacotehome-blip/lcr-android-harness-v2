plugins { id 'com.android.application' }

// ✅ AJOUTÉ (24 août 2026, demande Paul — "un moyen pour savoir quel
// version nous sommes rendu dans l'apk après chaque commit") — capture le
// hash court du commit git ET la date/heure du build directement au
// moment de la compilation, injectés dans BuildConfig, affichés dans
// l'app. Résout exactement la confusion des derniers tours : impossible
// de savoir si un build testé correspondait vraiment au dernier code
// livré.
def gitCommitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def hash = stdout.toString().trim()
        return hash.isEmpty() ? "unknown" : hash
    } catch (Exception e) {
        return "unknown"
    }
}()

def buildTimestamp = new Date().format("yyyy-MM-dd HH:mm")

android {
  namespace 'com.pa.lcrdemo'
  compileSdkVersion 34

  defaultConfig {
    applicationId 'com.pa.lcrdemo'
    minSdkVersion 26
    targetSdkVersion 34
    versionCode 1
    versionName '1.0'
    buildConfigField "String", "GIT_COMMIT", "\"${gitCommitHash}\""
    buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  packagingOptions {
    resources {
      excludes += ['/META-INF/*']
    }
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.android.material:material:1.12.0'

  // usb-serial (JitPack) — choisir une des 2 lignes :
  implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
  // implementation 'com.github.mik3y:usb-serial-for-android:v3.10.0'
  implementation 'com.microsoft.identity.client:msal:6.+'
implementation 'androidx.work:work-runtime:2.9.0'
}

