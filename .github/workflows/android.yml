name: Android CI
on:
  push:
    branches: ["main", "feature/**", "bugfix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Récupérer le dépôt
      - name: Checkout
        uses: actions/checkout@v4
      # 2) JDK 17 (requis par AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 3) Cache Gradle (caches + wrapper)
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # 4) Télécharger Gradle 8.7 et générer le wrapper (si absent/obsolète)
      - name: Bootstrap Gradle Wrapper (8.7)
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle --version
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          ls -la gradle/wrapper || true
          head -n 5 gradlew || true
      # 5) Rendre gradlew exécutable
      - name: Make gradlew executable
        run: chmod +x gradlew
      # 6) Installer/valider les composants SDK Android requis
      #    NOTE: sur les runners GitHub, le SDK Android est déjà présent sous /usr/local/lib/android/sdk
      - name: Install Android SDK components
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # 1) Fix ANDROID_SDK_ROOT si absent : valeur standard des runners GitHub
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          # 2) Résoudre sdkmanager
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # Fallback (si la disposition change)
            SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ Impossible de localiser sdkmanager sous $ANDROID_SDK_ROOT"
            echo "Contenu de $ANDROID_SDK_ROOT :"
            ls -R "$ANDROID_SDK_ROOT" || true
            exit 1
          fi
          echo "✅ ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "✅ sdkmanager=$SDKMANAGER"
          # 3) Accepter licences et installer les composants
          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
      # ✅ 7) Keystore fixe — même hash SHA1 à chaque build pour MSAL
      - name: Create fixed debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair \
            -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "✅ Keystore SHA1:"
          keytool -list -v \
            -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep SHA1
      # 8) Compilation de l'APK Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --warning-mode all
      # 9) Publication de l'APK Debug en artifact
      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
