
name: Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupérer le dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 17 (requis par AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) Télécharger Gradle 8.7 et générer le wrapper
      - name: Bootstrap Gradle Wrapper (8.7)
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
          ./gradle-8.7/bin/gradle --version
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          ls -la gradle/wrapper || true
          head -n 5 gradlew || true

      # 4) Rendre le wrapper exécutable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5) Build de l’APK Debug avec le wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --warning-mode all

      # 6) Uploader l’APK comme artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
