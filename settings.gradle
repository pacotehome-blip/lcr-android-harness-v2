
pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }
  plugins {
    id 'com.android.application' version '8.5.2'
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    // JitPack pour usb-serial-for-android
    maven { url "https://jitpack.io" }
  }
}

rootProject.name = 'lcr_android_harness_v2'
include(':app')
